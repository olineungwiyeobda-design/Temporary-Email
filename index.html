<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>임시 이메일 - 게임 인증용</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent),
                radial-gradient(1px 1px at 15% 55%, white, transparent);
            background-size: 200% 200%;
            animation: stars 120s linear infinite;
            opacity: 0.6;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.15) 0%, transparent 50%);
            animation: galaxyRotate 60s linear infinite;
            z-index: 0;
        }

        @keyframes stars {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }

        @keyframes galaxyRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(15, 20, 40, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: grid;
            grid-template-columns: 380px 1fr;
            min-height: 700px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .sidebar {
            background: rgba(20, 25, 45, 0.7);
            backdrop-filter: blur(10px);
            padding: 30px;
            color: white;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        .header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .email-display {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .email-display label {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .email-input-group {
            display: flex;
            gap: 10px;
        }

        .email-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ffffff;
            font-weight: 400;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .btn-primary {
            background: rgba(88, 101, 242, 0.8);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-copy {
            background: rgba(67, 181, 129, 0.7);
            color: white;
            padding: 10px;
        }

        .btn-refresh {
            background: rgba(250, 166, 26, 0.7);
            color: white;
            padding: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: 600;
            color: rgba(88, 101, 242, 0.9);
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .info-box {
            background: rgba(88, 101, 242, 0.08);
            border-left: 3px solid rgba(88, 101, 242, 0.6);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        .main-content {
            padding: 30px;
            background: rgba(10, 14, 39, 0.4);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .content-header h2 {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-online {
            background: rgba(67, 181, 129, 0.15);
            color: #43b581;
            border: 1px solid rgba(67, 181, 129, 0.3);
        }

        .status-waiting {
            background: rgba(250, 166, 26, 0.15);
            color: #faa61a;
            border: 1px solid rgba(250, 166, 26, 0.3);
        }

        .email-list {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .email-item {
            padding: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .email-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .email-item.unread {
            background: rgba(88, 101, 242, 0.05);
        }

        .email-item.unread::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: rgba(88, 101, 242, 0.8);
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .email-from {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
        }

        .email-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .email-subject {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
            font-weight: 400;
        }

        .email-preview {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .verification-code {
            display: inline-block;
            background: rgba(88, 101, 242, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 3px;
            margin: 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .email-detail {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 18px;
            margin-bottom: 18px;
        }

        .detail-header h3 {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .detail-info {
            display: grid;
            gap: 8px;
            font-size: 13px;
        }

        .detail-info div {
            display: flex;
            color: rgba(255, 255, 255, 0.7);
        }

        .detail-info strong {
            width: 100px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .detail-body {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            white-space: pre-wrap;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 사이드바 -->
        <div class="sidebar">
            <div class="header">
                <h1>📧 임시 이메일</h1>
                <p>게임 인증용</p>
            </div>

            <div class="email-display">
                <label>임시 이메일 주소</label>
                <div class="email-input-group">
                    <input type="text" id="emailAddress" class="email-input" readonly placeholder="이메일 생성을 클릭하세요">
                    <button class="btn btn-copy" onclick="copyEmail()" title="복사">
                        📋
                    </button>
                    <button class="btn btn-refresh" onclick="refreshEmails()" title="새로고침">
                        🔄
                    </button>
                </div>
            </div>

            <button class="btn btn-primary" onclick="generateEmail()">
                ✨ 새 이메일 생성
            </button>

            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="emailCount">0</div>
                    <div class="label">받은 메일</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="timeLeft">--:--</div>
                    <div class="label">남은 시간</div>
                </div>
            </div>

            <div class="info-box">
                <strong>사용법</strong><br>
                1. 이메일 생성<br>
                2. 주소 복사<br>
                3. 게임에 붙여넣기<br>
                4. 인증 메일 수신
            </div>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="main-content">
            <div class="content-header">
                <h2>📬 받은 메일함</h2>
                <span class="status-badge status-waiting" id="statusBadge">
                    ⏳ 대기 중
                </span>
            </div>

            <div class="email-list" id="emailList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <h3>받은 메일 없음</h3>
                    <p>게임에서 인증 메일 전송 대기중</p>
                </div>
            </div>

            <div id="emailDetail" style="display: none;"></div>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let emails = [];
        let refreshInterval;
        let timeInterval;
        let expiryTime;

        async function generateEmail() {
            try {
                const response = await fetch('https://api.allorigins.win/raw?url=https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
                const data = await response.json();
                currentEmail = data[0];
                
                document.getElementById('emailAddress').value = currentEmail;
                document.getElementById('statusBadge').className = 'status-badge status-online';
                document.getElementById('statusBadge').innerHTML = '✅ 활성화';
                
                emails = [];
                updateEmailList();
                
                // 10분 타이머 시작
                expiryTime = Date.now() + (10 * 60 * 1000);
                startTimer();
                
                // 자동 새로고침 시작 (5초마다)
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(refreshEmails, 5000);
                
                // 즉시 한번 새로고침
                refreshEmails();
                
                alert('임시 이메일이 생성되었습니다!\n\n' + currentEmail + '\n\n게임 가입 시 이 이메일을 사용하세요.');
            } catch (error) {
                alert('이메일 생성 실패: ' + error.message);
            }
        }

        async function refreshEmails() {
            if (!currentEmail) return;

            try {
                const [login, domain] = currentEmail.split('@');
                const response = await fetch(`https://api.allorigins.win/raw?url=https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    emails = data;
                    updateEmailList();
                    document.getElementById('emailCount').textContent = emails.length;
                }
            } catch (error) {
                console.error('새로고침 실패:', error);
            }
        }

        function updateEmailList() {
            const listElement = document.getElementById('emailList');
            
            if (emails.length === 0) {
                listElement.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        <h3>받은 메일 없음</h3>
                        <p>대기중...</p>
                    </div>
                `;
                return;
            }

            listElement.innerHTML = emails.map(email => `
                <div class="email-item unread" onclick="viewEmail(${email.id})">
                    <div class="email-header">
                        <div class="email-from">${email.from}</div>
                        <div class="email-time">${email.date}</div>
                    </div>
                    <div class="email-subject">${email.subject}</div>
                    <div class="email-preview">클릭하여 전체 내용 보기</div>
                </div>
            `).join('');
        }

        async function viewEmail(emailId) {
            try {
                const [login, domain] = currentEmail.split('@');
                const response = await fetch(`https://api.allorigins.win/raw?url=https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${emailId}`);
                const data = await response.json();
                
                const body = data.textBody || data.body || '';
                
                // 인증 코드 찾기 (6자리 숫자)
                const codeMatch = body.match(/\b\d{6}\b/);
                const verificationCode = codeMatch ? codeMatch[0] : null;
                
                const detailElement = document.getElementById('emailDetail');
                detailElement.style.display = 'block';
                detailElement.innerHTML = `
                    <div class="email-detail">
                        <div class="detail-header">
                            <h3>${data.subject}</h3>
                            <div class="detail-info">
                                <div><strong>보낸 사람:</strong> ${data.from}</div>
                                <div><strong>받은 시간:</strong> ${data.date}</div>
                            </div>
                        </div>
                        ${verificationCode ? `
                            <div style="background: rgba(88, 101, 242, 0.1); padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid rgba(88, 101, 242, 0.2);">
                                <div style="font-size: 13px; color: rgba(255, 255, 255, 0.7); margin-bottom: 10px;">🔐 인증 코드</div>
                                <div class="verification-code">${verificationCode}</div>
                                <button class="btn btn-primary" style="margin-top: 15px;" onclick="copyCode('${verificationCode}')">
                                    코드 복사
                                </button>
                            </div>
                        ` : ''}
                        <div class="detail-body">${body}</div>
                    </div>
                `;
                
                detailElement.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                alert('이메일 읽기 실패: ' + error.message);
            }
        }

        function copyEmail() {
            const emailInput = document.getElementById('emailAddress');
            if (emailInput.value) {
                navigator.clipboard.writeText(emailInput.value);
                alert('이메일 주소가 복사되었습니다!\n' + emailInput.value);
            }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            alert('인증 코드가 복사되었습니다!\n' + code);
        }

        function startTimer() {
            if (timeInterval) clearInterval(timeInterval);
            
            timeInterval = setInterval(() => {
                const remaining = expiryTime - Date.now();
                
                if (remaining <= 0) {
                    clearInterval(timeInterval);
                    clearInterval(refreshInterval);
                    document.getElementById('timeLeft').textContent = '만료됨';
                    document.getElementById('statusBadge').className = 'status-badge';
                    document.getElementById('statusBadge').innerHTML = '⏰ 시간 만료';
                    return;
                }
                
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('timeLeft').textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
    </script>
</body>
</html>
